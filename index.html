<!doctype html><html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>相手選出スキャン</title>
<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#0e1420">
<meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--bg:#0e1420;--pan:#182031;--pan2:#1f2a3d;--bd:#2b384f;--tx:#e7edf6;--mut:#8695ab;--gold:#f5c451;--good:#4fd18b;--bad:#ff6b7a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;padding:16px 12px 60px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:19px;margin:0 0 2px}.sub{color:var(--mut);font-size:11px;margin-bottom:14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:10px;border-radius:9px;border:1px solid var(--bd);background:var(--pan);color:var(--mut);font-weight:700;font-size:13px;text-align:center;cursor:pointer}
.tab.on{background:var(--gold);color:#12161d;border-color:var(--gold)}
.panel{background:var(--pan);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.btn{background:var(--gold);color:#12161d;border:none;border-radius:9px;padding:11px 14px;font-weight:800;font-size:14px;cursor:pointer;width:100%}
.btn.sec{background:var(--pan2);color:var(--tx);border:1px solid var(--bd)}
label.file{display:block;border:1px dashed var(--bd);border-radius:10px;padding:18px;text-align:center;color:var(--mut);cursor:pointer;font-size:14px}
input[type=file]{display:none}
select{width:100%;background:var(--pan2);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:8px;font-size:14px}
.slot{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.slot img{width:56px;height:56px;border-radius:8px;border:1px solid var(--bd);flex:none;background:#0a0f18;object-fit:contain}
.slot .info{flex:1;min-width:0}
.conf{font-size:10px;font-family:ui-monospace,monospace}
.mut{color:var(--mut)}.good{color:var(--good)}.bad{color:var(--bad)}.gold{color:var(--gold)}
.chip{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;color:#12161d}
.rec{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.rec .rank{font-family:ui-monospace,monospace;color:var(--gold);font-weight:700;width:18px}
.small{font-size:11px;color:var(--mut);line-height:1.7}
.row{display:flex;gap:8px;margin-top:6px}.row>*{flex:1}
.num{width:100%;background:var(--pan2);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px;font-size:13px}
</style></head><body><div class="wrap">
<h1>相手選出スキャン</h1><div class="sub">オフライン照合 / 教えて→次から自動判定 / AIなし・無料</div>
<div class="tabs">
<div class="tab on" data-t="scan">スキャン</div>
<div class="tab" data-t="teach">図鑑を教える</div>
<div class="tab" data-t="setup">枠合わせ</div>
</div>

<div id="scan">
  <div class="panel">
    <label class="file">相手側が写ったスクショを選ぶ<input type="file" accept="image/*" id="fScan"></label>
    <div id="scanSlots"></div>
  </div>
  <div class="panel" id="recPanel" style="display:none">
    <div style="font-weight:700;color:var(--gold);margin-bottom:8px">推奨選出（シングル・3体）</div>
    <div id="recList"></div>
    <div id="recNote" class="small" style="margin-top:10px"></div>
  </div>
</div>

<div id="teach" style="display:none">
  <div class="panel">
    <div class="small" style="margin-bottom:8px">スクショを読み込むと相手6枠を切り出します。各枠に名前を割り当てて「覚えさせる」で、次からその見た目を自動判定します（端末内保存・外部送信なし）。</div>
    <label class="file">教える用スクショを選ぶ<input type="file" accept="image/*" id="fTeach"></label>
    <div id="teachSlots"></div>
    <button class="btn" id="saveTeach" style="display:none;margin-top:10px">選んだ名前で覚えさせる</button>
  </div>
  <div class="panel">
    <div style="font-weight:700;margin-bottom:6px">保存済み図鑑 <span id="dexCount" class="mut"></span></div>
    <div id="dexList" class="small"></div>
    <button class="btn sec" id="clearDex" style="margin-top:10px">図鑑を全消去</button>
  </div>
</div>

<div id="setup" style="display:none">
  <div class="panel">
    <div class="small">機種・解像度が違うと切り出し位置がズレます。相手側スクショを読み込み、6枠が緑ワクにピッタリ入るよう数値を調整して保存してください（この端末では初期値で合っているはずです）。</div>
    <label class="file">位置確認用スクショを選ぶ<input type="file" accept="image/*" id="fSetup"></label>
    <canvas id="calCanvas" style="width:100%;margin-top:10px;border-radius:8px;display:none"></canvas>
    <div class="row"><div><div class="small">左端X %</div><input class="num" id="cx0" type="number" step="0.001"></div>
    <div><div class="small">右端X %</div><input class="num" id="cx1" type="number" step="0.001"></div></div>
    <div class="row"><div><div class="small">1枠目 上端Y</div><input class="num" id="cy0" type="number" step="0.001"></div>
    <div><div class="small">枠の高さ</div><input class="num" id="ch" type="number" step="0.001"></div>
    <div><div class="small">縦の間隔</div><input class="num" id="cp" type="number" step="0.001"></div></div>
    <button class="btn" id="saveCal" style="margin-top:10px">枠設定を保存</button>
  </div>
</div>

<script>
/* ============ データ ============ */
const CHART={ノーマル:{ゴースト:0,いわ:.5,はがね:.5},ほのお:{くさ:2,こおり:2,むし:2,はがね:2,ほのお:.5,みず:.5,いわ:.5,ドラゴン:.5},みず:{ほのお:2,じめん:2,いわ:2,みず:.5,くさ:.5,ドラゴン:.5},でんき:{みず:2,ひこう:2,でんき:.5,くさ:.5,ドラゴン:.5,じめん:0},くさ:{みず:2,じめん:2,いわ:2,ほのお:.5,くさ:.5,どく:.5,ひこう:.5,むし:.5,ドラゴン:.5,はがね:.5},こおり:{くさ:2,じめん:2,ひこう:2,ドラゴン:2,ほのお:.5,みず:.5,こおり:.5,はがね:.5},かくとう:{ノーマル:2,いわ:2,はがね:2,こおり:2,あく:2,どく:.5,ひこう:.5,エスパー:.5,むし:.5,フェアリー:.5,ゴースト:0},どく:{くさ:2,フェアリー:2,どく:.5,じめん:.5,いわ:.5,ゴースト:.5,はがね:0},じめん:{ほのお:2,でんき:2,どく:2,いわ:2,はがね:2,くさ:.5,むし:.5,ひこう:0},ひこう:{くさ:2,かくとう:2,むし:2,でんき:.5,いわ:.5,はがね:.5},エスパー:{かくとう:2,どく:2,エスパー:.5,はがね:.5,あく:0},むし:{くさ:2,エスパー:2,あく:2,ほのお:.5,かくとう:.5,どく:.5,ひこう:.5,ゴースト:.5,はがね:.5,フェアリー:.5},いわ:{ほのお:2,こおり:2,ひこう:2,むし:2,かくとう:.5,じめん:.5,はがね:.5},ゴースト:{エスパー:2,ゴースト:2,あく:.5,ノーマル:0},ドラゴン:{ドラゴン:2,はがね:.5,フェアリー:0},あく:{エスパー:2,ゴースト:2,かくとう:.5,あく:.5,フェアリー:.5},はがね:{こおり:2,いわ:2,フェアリー:2,ほのお:.5,みず:.5,でんき:.5,はがね:.5},フェアリー:{かくとう:2,ドラゴン:2,あく:2,ほのお:.5,どく:.5,はがね:.5}};
const TC={ノーマル:"#9099a1",ほのお:"#ff9d55",みず:"#4d90d5",でんき:"#f4d23c",くさ:"#63bc5a",こおり:"#73cec0",かくとう:"#ce4069",どく:"#ab6ac8",じめん:"#d97845",ひこう:"#8fa8dd",エスパー:"#f97176",むし:"#90c12c",いわ:"#c7b78b",ゴースト:"#5269ac",ドラゴン:"#0b6dc3",あく:"#5a5366",はがね:"#5a8ea1",フェアリー:"#ec8fe6"};
const P={
 "ピクシー":{t:["フェアリー"],b:[95,70,73,95,90,60],m:"メガピクシー"},
 "メガピクシー":{t:["フェアリー","ひこう"],b:[95,80,93,135,110,70]},
 "バシャーモ":{t:["ほのお","かくとう"],b:[80,120,70,110,70,80],m:"メガバシャーモ"},
 "メガバシャーモ":{t:["ほのお","かくとう"],b:[80,160,80,130,80,100]},
 "アローラキュウコン":{t:["こおり","フェアリー"],b:[73,67,75,81,100,109]},
 "ニンフィア":{t:["フェアリー"],b:[95,65,65,110,130,60]},
 "クエスパトラ":{t:["エスパー"],b:[95,60,60,101,60,105]},
 "フラージェス":{t:["フェアリー"],b:[78,65,68,112,154,75]},
 "ドリュウズ":{t:["じめん","はがね"],b:[110,135,60,50,65,88]},
 "ライチュウ":{t:["でんき"],b:[60,90,55,90,80,110]},
 "カバルドン":{t:["じめん"],b:[108,112,118,68,72,47]},
 "ミミッキュ":{t:["ゴースト","フェアリー"],b:[55,90,80,50,105,96]},
 "ガブリアス":{t:["じめん","ドラゴン"],b:[108,130,95,80,85,102],m:"メガガブリアス"},
 "メガガブリアス":{t:["じめん","ドラゴン"],b:[108,170,115,120,95,92]},
 "バイバニラ":{t:["こおり"],b:[71,95,85,110,95,79]},
 "バンギラス":{t:["いわ","あく"],b:[100,134,110,95,100,61]},
 "カイリュー":{t:["ドラゴン","ひこう"],b:[91,134,95,100,100,80]},
 "ハバタクカミ":{t:["ゴースト","フェアリー"],b:[55,55,55,135,135,135]},
 "テツノカイナ":{t:["でんき","かくとう"],b:[154,140,108,50,68,50]},
 "サーフゴー":{t:["はがね","ゴースト"],b:[87,60,95,133,91,84]},
 "モロバレル":{t:["くさ","どく"],b:[114,85,70,85,80,30]},
 "ドラパルト":{t:["ドラゴン","ゴースト"],b:[88,120,75,100,75,142]},
 "ガオガエン":{t:["ほのお","あく"],b:[95,115,90,80,90,60]}
};
const MY_DEFAULT=["ピクシー","バシャーモ","アローラキュウコン","ニンフィア","クエスパトラ","フラージェス"];
const NAMES=Object.keys(P);

/* ============ 選出ロジック(カバー範囲ベース) ============ */
function stat(base,i,inv){if(i===0)return Math.floor((2*base+31)*50/100)+50+10+inv;let v=Math.floor((2*base+31)*50/100)+5+inv;return Math.floor(v*(inv?1.1:1));}
function eff(mt,dts){let m=1;for(const d of dts){const r=CHART[mt]||{};if(d in r)m*=r[d];}return m;}
function formOf(n){const p=P[n];return(p&&p.m)?p.m:n;}
function threat(att,def){const a=P[formOf(att)],d=P[formOf(def)];if(!a||!d)return 0;const useP=a.b[1]>=a.b[3];const A=useP?stat(a.b[1],1,32):stat(a.b[3],3,32);const dDef=useP?stat(d.b[2],2,0):stat(d.b[4],4,0);const maxHP=stat(d.b[0],0,0);let best=0;for(const ty of a.t){const e=eff(ty,d.t);if(e===0)continue;const base=Math.floor(Math.floor(Math.floor((2*50/5+2)*95*A/dDef)/50)+2);const pct=base*1.5*e/maxHP*100;if(pct>best)best=pct;}return best;}
function recommend(my,opp){
 const cov=my.map(base=>{const list=opp.map(o=>({o,pct:threat(base,o)}));const handles=list.filter(x=>x.pct>=90).map(x=>x.o);const avg=list.reduce((s,x)=>s+x.pct,0)/opp.length;return{base,list,handles,avg,spe:P[formOf(base)].b[5],megaCap:!!P[base].m};});
 const core=[];const covered=new Set();
 while(core.length<3){let best=null;
   cov.forEach(c=>{if(core.find(x=>x.base===c.base))return;const nc=c.handles.filter(o=>!covered.has(o)).length;if(nc<=0)return;const key=nc*1000+c.avg;if(!best||key>best.key)best={c,key};});
   if(!best)break;const nn=best.c.handles.filter(o=>!covered.has(o));core.push({base:best.c.base,covers:nn,megaCap:best.c.megaCap});nn.forEach(o=>covered.add(o));}
 const uncovered=opp.filter(o=>!covered.has(o));
 const flex=cov.filter(c=>!core.find(x=>x.base===c.base)).sort((a,b)=>b.spe-a.spe||b.avg-a.avg).slice(0,3).map(c=>({base:c.base,spe:c.spe,avg:Math.round(c.avg)}));
 let megaPick=null;core.forEach(c=>{if(c.megaCap&&!megaPick)megaPick=c.base;});
 return{core,uncovered,flex,megaPick};
}

/* ============ 画像→ベクトル ============ */
const DEF_CAL={x0:0.7603,x1:0.8373,y0:0.1171,h:0.10598,p:0.11658,n:6};
const getCal=()=>{try{return JSON.parse(localStorage.getItem("pc_cal_v1"))||DEF_CAL}catch(e){return DEF_CAL}};
const setCal=c=>localStorage.setItem("pc_cal_v1",JSON.stringify(c));
const getDex=()=>{try{return JSON.parse(localStorage.getItem("pc_dex_v1"))||[]}catch(e){return[]}};
const setDex=d=>localStorage.setItem("pc_dex_v1",JSON.stringify(d));
const loadImg=file=>new Promise(res=>{const img=new Image();img.onload=()=>res(img);img.src=URL.createObjectURL(file)});
function cropVec(img,slot,cal){const W=img.naturalWidth,H=img.naturalHeight;const xa=cal.x0*W,xb=cal.x1*W,ya=(cal.y0+cal.p*slot)*H+6,yb=(cal.y0+cal.p*slot+cal.h)*H-6;const cvs=document.createElement("canvas");cvs.width=32;cvs.height=32;const ctx=cvs.getContext("2d");ctx.drawImage(img,xa,ya,xb-xa,yb-ya,0,0,32,32);const d=ctx.getImageData(0,0,32,32).data;const v=new Float32Array(1024);let mean=0;for(let i=0;i<1024;i++){const g=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];v[i]=g;mean+=g;}mean/=1024;let sd=0;for(let i=0;i<1024;i++)sd+=(v[i]-mean)**2;sd=Math.sqrt(sd/1024)+1e-6;for(let i=0;i<1024;i++)v[i]=(v[i]-mean)/sd;return{v:Array.from(v),thumb:cvs.toDataURL()};}
function dist(a,b){let s=0;for(let i=0;i<1024;i++){const d=a[i]-b[i];s+=d*d;}return s/1024;}
function matchVec(v){const dex=getDex();let best=null;for(const e of dex){const dd=dist(v,e.v);if(!best||dd<best.d)best={name:e.name,d:dd};}return best;}

/* ============ UI ============ */
const $=s=>document.querySelector(s);
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");["scan","teach","setup"].forEach(id=>$("#"+id).style.display="none");$("#"+t.dataset.t).style.display="";});
const typeChips=name=>{const p=P[name];return p?p.t.map(t=>`<span class="chip" style="background:${TC[t]}">${t}</span>`).join(" "):""};
const nameOptions=sel=>NAMES.map(n=>`<option ${n===sel?"selected":""}>${n}</option>`).join("");

/* 教える */
let teachData=null;
$("#fTeach").onchange=async e=>{const img=await loadImg(e.target.files[0]);const cal=getCal();teachData=[];let html="";for(let i=0;i<cal.n;i++){const c=cropVec(img,i,cal);teachData.push(c);html+=`<div class="slot"><img src="${c.thumb}"><div class="info"><select data-i="${i}">${nameOptions()}</select></div></div>`;}$("#teachSlots").innerHTML=html;$("#saveTeach").style.display="";};
$("#saveTeach").onclick=()=>{const dex=getDex();document.querySelectorAll("#teachSlots select").forEach(s=>{const i=+s.dataset.i,name=s.value,k=dex.findIndex(e=>e.name===name),entry={name,v:teachData[i].v};if(k>=0)dex[k]=entry;else dex.push(entry);});setDex(dex);renderDex();alert("覚えました（計"+getDex().length+"件）");};
function renderDex(){const dex=getDex();$("#dexCount").textContent="("+dex.length+"件)";$("#dexList").innerHTML=dex.length?dex.map(e=>e.name).join(" / "):"まだ空です。相手6体を教えてください。";}
$("#clearDex").onclick=()=>{if(confirm("図鑑を全消去しますか？")){setDex([]);renderDex();}};

/* スキャン */
$("#fScan").onchange=async e=>{const img=await loadImg(e.target.files[0]);const cal=getCal();const detected=[];let html="";for(let i=0;i<cal.n;i++){const c=cropVec(img,i,cal);const m=matchVec(c.v);const known=m&&m.d<0.6;const guess=known?m.name:"";detected.push(guess);const conf=m?(m.d<0.35?"高":m.d<0.6?"中":"低"):"—";const cc=m?(m.d<0.35?"good":m.d<0.6?"gold":"bad"):"mut";html+=`<div class="slot"><img src="${c.thumb}"><div class="info"><select data-i="${i}"><option value="">— 不明 —</option>${nameOptions(guess)}</select><div class="conf ${cc}">照合:${conf}${m?" d="+m.d.toFixed(2):""}</div></div></div>`;}$("#scanSlots").innerHTML=html+`<button class="btn" id="doRec" style="margin-top:10px">この6体で選出を計算</button>`;$("#doRec").onclick=()=>{const opp=[...document.querySelectorAll("#scanSlots select")].map(s=>s.value).filter(Boolean);if(!opp.length){alert("相手を1体以上指定してください");return;}runRec(opp);};const known=detected.filter(Boolean);if(known.length)runRec(known);};
function runRec(opp){const {core,uncovered,flex,megaPick}=recommend(MY_DEFAULT,opp);let h='<div class="small gold" style="margin-bottom:4px">コア（この数体で受け回す）</div>';h+=core.map((c,i)=>{const tag=c.base===megaPick?'<span class="chip" style="background:var(--gold)">メガ</span>':(c.megaCap?'<span class="chip" style="background:var(--pan2);color:var(--tx)">通常で</span>':'');return `<div class="rec"><span class="rank">${i+1}</span><span style="flex:1;font-weight:700">${c.base}</span>${typeChips(c.base)} ${tag}<span class="conf good" style="min-width:96px;text-align:right">${c.covers.join("・")||"—"}</span></div>`;}).join("");h+=uncovered.length?`<div class="small bad" style="margin-top:6px">⚠ 一撃圏で見れない: ${uncovered.join("・")}（削り/起点が必要）</div>`:`<div class="small good" style="margin-top:6px">✓ 相手6体すべてに刺さる打点あり</div>`;if(core.length<3&&flex.length){h+='<div class="small gold" style="margin:10px 0 4px">3枠目の候補（好みで選択）</div>';h+=flex.map(f=>`<div class="rec"><span style="flex:1">${f.base}</span>${typeChips(f.base)}<span class="conf mut" style="min-width:120px;text-align:right">素早${f.spe} / 平均打点${f.avg}%</span></div>`).join("");}h+='<div class="small" style="margin:10px 0 4px">各相手への最適解</div><div class="small">'+opp.map(o=>{let b=null;MY_DEFAULT.forEach(m=>{const p=threat(m,o);if(!b||p>b.p)b={m,p};});return `${o} → <b style="color:var(--tx)">${b.m}</b> ${b.p.toFixed(0)}%`;}).join("<br>")+'</div>';$("#recList").innerHTML=h;const notes=[];opp.forEach(o=>{if(P[o]&&P[o].m)notes.push(o+"→"+P[o].m+"警戒");});let note="相手: "+opp.join("・")+"。";if(opp.includes("ドリュウズ"))note+=" ⚠ドリュウズの鋼技はアローラキュウコンに4倍・砂かき採用時は素早さ注意。";if(notes.length)note+=" メガ警戒: "+notes.join(", ")+"（選出画面では通常フォルム表示）。";note+=" ※STABベースの簡易評価。持ち物/技/砂の影響はダメージ計算で詰めてください。";$("#recNote").textContent=note;$("#recPanel").style.display="";}

/* 枠合わせ */
function fillCal(){const c=getCal();cx0.value=c.x0;cx1.value=c.x1;cy0.value=c.y0;ch.value=c.h;cp.value=c.p;}
$("#fSetup").onchange=async e=>{const img=await loadImg(e.target.files[0]);const cv=$("#calCanvas");cv.style.display="";const W=img.naturalWidth,H=img.naturalHeight;cv.width=W;cv.height=H;const ctx=cv.getContext("2d");function draw(){ctx.drawImage(img,0,0);const c=getCal();ctx.strokeStyle="#4fd18b";ctx.lineWidth=Math.max(2,W*0.002);for(let i=0;i<c.n;i++){const xa=c.x0*W,ya=(c.y0+c.p*i)*H;ctx.strokeRect(xa,ya,(c.x1-c.x0)*W,c.h*H);}}draw();cv._draw=draw;};
["cx0","cx1","cy0","ch","cp"].forEach(id=>$("#"+id).oninput=()=>{const c={x0:+cx0.value,x1:+cx1.value,y0:+cy0.value,h:+ch.value,p:+cp.value,n:6};localStorage.setItem("pc_cal_v1",JSON.stringify(c));const cv=$("#calCanvas");if(cv._draw)cv._draw();});
$("#saveCal").onclick=()=>{setCal({x0:+cx0.value,x1:+cx1.value,y0:+cy0.value,h:+ch.value,p:+cp.value,n:6});alert("保存しました");};
